name: Go Quality & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Linting: Ensures code style and catches common bugs
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22" # Match your local Go version

      - name: golangci-lint
        uses: golangci-lint/golangci-lint-action@v4
        with:
          version: latest

  # 2. Test: Runs unit tests and checks for race conditions
  test:
    name: Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true # Speeds up subsequent runs

      - name: Run Tests
        run: go test -v -race ./...

  # 3. Build: Ensures the project compiles for multiple OS targets
  build:
    name: Multi-Platform Build
    runs-on: ubuntu-latest
    needs: [lint, test] # Only build if linting and tests pass
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME=gomarkdown-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME+='.exe'; fi
          go build -o $BINARY_NAME .
