name: Go Quality & Build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  lint:
    name: Linting
    runs-on: mdblogger-runner
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install and Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./... --out-format=colored-line-number

  test:
    name: Tests & Race Detection
    runs-on: mdblogger-runner
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Run Tests
        run: go test -v -race ./...

  build:
    name: Multi-Platform Build
    runs-on: mdblogger-runner
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME=gomarkdown-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME+='.exe'; fi
          go build -o $BINARY_NAME .

  podman:
    name: Podman Build & Push (k3s)
    runs-on: mdblogger-runner
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      # - name: Log in to Registry
      #   run: |
      #     podman login docker-registry.registry.svc.cluster.local:5000 \
      #       -u ${{ secrets.REGISTRY_USERNAME }} \
      #       -p ${{ secrets.REGISTRY_PASSWORD }} \
      #       --tls-verify=false

      - name: Build & Push
        run: |
          podman build -t docker-registry.registry.svc.cluster.local:5000/mdblogger:latest .
          podman push docker-registry.registry.svc.cluster.local:5000/mdblogger:latest --tls-verify=false
