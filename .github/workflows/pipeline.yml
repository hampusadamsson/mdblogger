name: Go Quality & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x" # Align with your project's version

      - name: golangci-lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          # Using 'latest' usually works, but if 1.25 is bleeding edge,
          # version v1.64.8+ is required.
          version: latest
          # This helps resolve the "output format" warning
          args: --out-format=colored-line-number

  test:
    name: Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Run Tests
        run: go test -v -race ./...

  build:
    name: Multi-Platform Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME=gomarkdown-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY_NAME+='.exe'; fi
          go build -o $BINARY_NAME .
